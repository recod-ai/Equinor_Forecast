campaign_name: UNISIM_IV_P12_Seq2Trend
run_scope:
  dataset_name: UNISIM_IV
  wells: [P12]
hpo_params:
  trials_per_cycle_schedule: [150, 100, 50]
  metric_to_optimize: weighted_score
  metric_weights: {val_smape_cum: 2.0, val_smape_agg: 2.0}
  lower_is_better: {val_smape_cum: true, val_smape_agg: true}
  search_space_func_name: define_search_space
job_defaults:
  seed: 42
  architecture_name: Seq2Trend
  feature_kind: Normal
  use_known_good: false
  lag_window: 300
  horizon: 300
  patience: 20
  test_size: 0.6
  val_size: 0.1
  aggregation_method: median
  evaluate_by_slice: true
  aggregation_quantiles: [0.25, 0.5, 0.75]
  plot: false
  scenario: P50
  band: null
  show_components: false
run_params: {ensemble_size: 1, max_workers: 1}
infra: {profiles_dir: ../../src/experiment_configs/profiles, experiments_output_dir: ../../src/experiment_configs/results,
  hpo_studies_dir: ../../src/experiment_configs/studies, log_level: INFO}
