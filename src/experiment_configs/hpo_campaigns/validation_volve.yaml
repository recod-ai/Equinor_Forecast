campaign_name: validation_volve
run_scope:
  dataset_name: FILTERED
  wells: [FILTERED]
job_defaults:
  seed: 42
  plot: true
  feature_kind: Normal
  use_known_good: false
  lag_window: 300
  horizon: 300
  patience: 20
  test_size: 0.6
  val_size: 0.1
  aggregation_method: median
  evaluate_by_slice: true
  slice_ratios: [1.0]
  aggregation_quantiles: [0.25, 0.5, 0.75]
run_params: {ensemble_size: 1, max_workers: 1}
infra: {profiles_dir: src/experiment_configs/profiles, experiments_output_dir: src/experiment_configs/results,
  hpo_studies_dir: src/experiment_configs/studies, architecture_yaml_path: src/experiment_configs/architectures_PINNs.yaml,
  log_level: INFO}
